name: hostelhub

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hostelhub
      POSTGRES_USER: hostelhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hostelhub}
    ports:
      - "5432:5432"
    volumes:
      - hostelhub-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hostelhub -d hostelhub"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    image: hostelhub-backend:local
    environment:
      DATABASE_URL: postgresql+psycopg://hostelhub:${POSTGRES_PASSWORD:-hostelhub}@db:5432/hostelhub
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: hostelhub-frontend:local
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:8080"
    restart: unless-stopped

volumes:
  hostelhub-pgdata:
