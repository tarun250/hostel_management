# Default values for the HostelHub chart.
# CI overrides backend.image.tag / frontend.image.tag with the git commit SHA.

nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

backend:
  image:
    repository: ghcr.io/tarun250/hostelhub-backend
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 2
  port: 8000
  appName: HostelHub API
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 384Mi }
  readinessProbe:
    httpGet: { path: /ready, port: http }
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3
  livenessProbe:
    httpGet: { path: /health, port: http }
    initialDelaySeconds: 20
    periodSeconds: 15
    failureThreshold: 3

frontend:
  image:
    repository: ghcr.io/tarun250/hostelhub-frontend
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 2
  port: 8080
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }

postgres:
  # Set enabled=false and fill externalDatabaseUrl to use RDS or another managed DB.
  enabled: true
  image: postgres:16-alpine
  database: hostelhub
  username: hostelhub
  # Placeholder only. Override at install time: --set postgres.password=...
  password: change-me
  storage: 1Gi
  storageClassName: ""
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

externalDatabaseUrl: ""

ingress:
  enabled: true
  className: nginx
  host: hostelhub.local
  annotations: {}
  tls: []

hpa:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

serviceMonitor:
  enabled: false
  interval: 15s
  # kube-prometheus-stack picks up ServiceMonitors with its release label.
  labels:
    release: monitoring
