{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hostelhub.secretName" . }}
  labels:
    {{- include "hostelhub.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "hostelhub.databaseUrl" . | quote }}
  {{- if .Values.postgres.enabled }}
  POSTGRES_USER: {{ .Values.postgres.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  {{- end }}
{{- end }}
