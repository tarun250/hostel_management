apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hostelhub.fullname" . }}-config
  labels:
    {{- include "hostelhub.labels" . | nindent 4 }}
data:
  APP_NAME: {{ .Values.backend.appName | quote }}
  BACKEND_URL: "http://{{ include "hostelhub.backendName" . }}:{{ .Values.backend.port }}"
