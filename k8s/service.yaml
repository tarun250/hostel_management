apiVersion: v1
kind: Service
metadata:
  name: hostelhub-db
  namespace: hostelhub
spec:
  selector: { app: hostelhub-db }
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: hostelhub-backend
  namespace: hostelhub
spec:
  selector: { app: hostelhub-backend }
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: hostelhub-frontend
  namespace: hostelhub
spec:
  type: NodePort
  selector: { app: hostelhub-frontend }
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
