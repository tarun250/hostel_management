# Plain manifests (no Helm) for a quick test cluster, e.g. kind/minikube:
#   kubectl apply -f k8s/namespace.yaml -f k8s/deployment.yaml -f k8s/service.yaml
# Images: build locally and load into the cluster, or swap in ghcr.io/<owner>/hostelhub-*:<sha>.
# The DB password below is a placeholder for a throwaway test cluster only.
apiVersion: v1
kind: Secret
metadata:
  name: hostelhub-db
  namespace: hostelhub
type: Opaque
stringData:
  POSTGRES_DB: hostelhub
  POSTGRES_USER: hostelhub
  POSTGRES_PASSWORD: change-me
  DATABASE_URL: postgresql+psycopg://hostelhub:change-me@hostelhub-db:5432/hostelhub
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hostelhub-db
  namespace: hostelhub
  labels: { app: hostelhub-db }
spec:
  replicas: 1
  selector:
    matchLabels: { app: hostelhub-db }
  template:
    metadata:
      labels: { app: hostelhub-db }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef: { name: hostelhub-db }
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}   # test cluster only; the Helm chart uses a PVC
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hostelhub-backend
  namespace: hostelhub
  labels: { app: hostelhub-backend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: hostelhub-backend }
  template:
    metadata:
      labels: { app: hostelhub-backend }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: backend
          image: hostelhub-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: hostelhub-db, key: DATABASE_URL }
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /ready, port: 8000 }
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hostelhub-frontend
  namespace: hostelhub
  labels: { app: hostelhub-frontend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: hostelhub-frontend }
  template:
    metadata:
      labels: { app: hostelhub-frontend }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
      containers:
        - name: frontend
          image: hostelhub-frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: BACKEND_URL
              value: http://hostelhub-backend:8000
          readinessProbe:
            httpGet: { path: /nginx-health, port: 8080 }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 200m, memory: 64Mi }
